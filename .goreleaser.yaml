---
version: 2

release:
  prerelease: auto
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'

builds:
  - skip: true

dockers_v2:
  - id: hermes
    images:
      - "ghcr.io/akash-network/hermes"
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    # Include Node.js source files in Docker build context
    extra_files:
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.build.json
      - src
